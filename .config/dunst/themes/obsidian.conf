# Obsidian · minimal X11 notifications.
# The 62 px vertical offset clears Qtile's 38 px bar and margins.
[global]
    monitor = 0
    follow = keyboard
    width = (340, 460)
    height = (0, 200)
    origin = top-right
    offset = (20, 62)
    notification_limit = 4
    scale = 0

    font = JetBrainsMono Nerd Font 10
    line_height = 3
    markup = full
    format = "<b>%s</b>\n%b"
    alignment = left
    vertical_alignment = center
    word_wrap = yes
    ellipsize = end
    ignore_newline = no

    padding = 14
    horizontal_padding = 16
    text_icon_padding = 12
    frame_width = 1
    frame_color = "#35434F"
    corner_radius = 12
    gaps_size = 9
    separator_height = 0
    transparency = 0

    icon_position = left
    min_icon_size = 30
    max_icon_size = 40
    enable_recursive_icon_lookup = true
    icon_theme = Papirus-Dark, Adwaita

    progress_bar = true
    progress_bar_height = 7
    progress_bar_min_width = 150
    progress_bar_max_width = 340
    progress_bar_frame_width = 0
    progress_bar_corner_radius = 4

    show_indicators = yes
    show_age_threshold = 60
    history_length = 50
    sticky_history = yes

    mouse_left_click = close_current
    mouse_middle_click = do_action, close_current
    mouse_right_click = close_all
    dmenu = rofi -dmenu -p "Acción"

[urgency_low]
    background = "#18232E"
    foreground = "#778895"
    frame_color = "#35434F"
    highlight = "#82CDBE"
    timeout = 4

[urgency_normal]
    background = "#18232E"
    foreground = "#C9D6E1"
    frame_color = "#35434F"
    highlight = "#82CDBE"
    timeout = 7

[urgency_critical]
    background = "#18232E"
    foreground = "#EDF3F8"
    frame_color = "#E78991"
    highlight = "#E78991"
    timeout = 0
