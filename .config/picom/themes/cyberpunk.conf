# Obsidian compositor for Qtile X11 (NVIDIA-compatible baseline).
# GLX + VSync; no expensive background blur or forced opacity on applications.
backend = "glx";
vsync = true;
use-damage = true;
detect-client-opacity = true;

# Subtle dimension and no unwanted transparency.
shadow = true;
shadow-radius = 15;
shadow-opacity = 0.24;
shadow-offset-x = -6;
shadow-offset-y = -6;
shadow-color = "#040612";

fading = true;
fade-in-step = 0.08;
fade-out-step = 0.08;
fade-delta = 10;

corner-radius = 9;
blur-method = "none";
unredir-if-possible = false;

# Current Picom window rules, avoiding shadows on bars, menus and fullscreen.
rules = (
    { match = "window_type = 'dock' || window_type = 'desktop'";
      shadow = false; corner-radius = 0; },
    { match = "window_type = 'popup_menu' || window_type = 'dropdown_menu' || window_type = 'tooltip'";
      shadow = false; corner-radius = 0; fade = false; },
    { match = "class_g = 'Rofi' || class_g = 'Dunst'";
      shadow = false; },
    { match = "fullscreen";
      shadow = false; corner-radius = 0; fade = false; }
);
