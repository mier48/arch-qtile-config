name: Validate desktop themes
on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Validate theme profiles
        run: python -m unittest discover -s tests -v
      - name: Validate Python syntax
        run: python -m compileall -q .config/qtile
      - name: Validate shell syntax
        run: |
          bash -n .bashrc
          find .config/qtile -type f -name '*.sh' -exec sh -n {} \;
